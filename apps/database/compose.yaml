services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ryouri
      POSTGRES_USER: ryouri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryouri -d ryouri"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
