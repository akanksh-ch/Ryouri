services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ryouri
      POSTGRES_USER: ryouri
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${HOME:?HOME must be set}/.local/state/ryouri/database:/var/lib/postgresql/data:Z
      - ./migrations:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryouri -d ryouri"]
      interval: 5s
      timeout: 5s
      retries: 10
